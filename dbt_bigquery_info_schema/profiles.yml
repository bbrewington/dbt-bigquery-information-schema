bigquery_profile:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('DBT_BQ_PROJECT', 'your-gbq-project-here') }}"
      dataset: "{{ env_var('DBT_BQ_DATASET', 'gbq_info_schema') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
      location: "{{ env_var('DBT_BQ_LOCATION', 'US') }}"
      priority: interactive
