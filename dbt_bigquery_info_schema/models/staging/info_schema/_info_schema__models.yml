version: 2

models:
  - name: stg__info_schema__jobs
    description: Staging model for BigQuery JOBS view (same as JOBS_BY_PROJECT)
    columns:
      - name: job_id
        description: Unique identifier for the job
        tests:
          - unique
          - not_null

  - name: stg__info_schema__jobs_by_user
    description: Staging model for JOBS_BY_USER view (current user's jobs only). Note that the QUERY column is not available in this view.
    columns:
      - name: job_id
        description: Unique identifier for the job
        tests:
          - unique
          - not_null

  - name: stg__info_schema__tables
    description: Staging model for BigQuery TABLES view
    columns:
      - name: table_full_id
        description: Fully qualified table identifier (project.dataset.table)
        tests:
          - unique
          - not_null

  - name: stg__info_schema__columns
    description: Staging model for BigQuery COLUMNS view
    columns:
      - name: column_name
        description: Name of the column
        tests:
          - not_null

  - name: stg__info_schema__datasets
    description: Staging model for BigQuery SCHEMATA view
    columns:
      - name: dataset_name
        description: Name of the dataset (schema)
        tests:
          - unique
          - not_null

  - name: stg__info_schema__views
    description: Staging model for BigQuery VIEWS view
    columns:
      - name: table_name
        description: Name of the view
        tests:
          - not_null
